<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans JP',sans-serif">
  <defs>
    <pattern id="hex" width="24" height="41.57" patternUnits="userSpaceOnUse" patternTransform="scale(0.9)">
      <path d="M0,0 L6,10.39 L18,10.39 L24,0 M6,10.39 L0,20.78 L6,31.18 L18,31.18 L24,20.78 L18,10.39 M6,31.18 L0,41.57 M18,31.18 L24,41.57" fill="none" stroke="#3e4a5a" stroke-width="2"/>
    </pattern>
    <linearGradient id="tubeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".0"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22212a" stop-opacity=".35"/>
    </linearGradient>
    <!-- ナノチューブ（中心原点、幅280） -->
    <g id="tube">
      <rect x="-140" y="-42" width="280" height="84" rx="42" fill="#c9d3df"/>
      <rect x="-140" y="-42" width="280" height="84" rx="42" fill="url(#hex)"/>
      <rect x="-140" y="-42" width="280" height="84" rx="42" fill="url(#tubeShade)"/>
      <rect x="-140" y="-42" width="280" height="84" rx="42" fill="none" stroke="#22212a" stroke-width="4"/>
      <!-- 電極 -->
      <rect x="-178" y="-58" width="50" height="116" rx="8" fill="#f2c230" stroke="#22212a" stroke-width="4"/>
      <rect x="128" y="-58" width="50" height="116" rx="8" fill="#f2c230" stroke="#22212a" stroke-width="4"/>
    </g>
    <g id="electron">
      <circle r="15" fill="#4f8fe0" stroke="#22212a" stroke-width="3"/>
      <rect x="-7" y="-2" width="14" height="4" fill="#fff"/>
    </g>
    <g id="molecule">
      <circle r="20" fill="#e2504f" stroke="#22212a" stroke-width="3.5"/>
      <circle cx="-6" cy="-7" r="5" fill="#fff" opacity=".7"/>
    </g>
  </defs>

  <rect width="1280" height="720" fill="#fbfaf6"/>

  <!-- タイトル -->
  <text x="640" y="88" text-anchor="middle" font-size="60" font-weight="900" fill="#2c4a6e">MITの<tspan fill="#c8393b">ナノチューブ</tspan>センサー</text>

  <!-- ① 電気がスイスイ流れる -->
  <g transform="translate(190,330) scale(0.82)">
    <use href="#tube"/>
    <use href="#electron" x="-80" y="-80"/><use href="#electron" x="-20" y="-80"/><use href="#electron" x="40" y="-80"/>
    <path d="M-110,-118 H90" stroke="#4f8fe0" stroke-width="10" stroke-linecap="round"/>
    <path d="M78,-134 L104,-118 L78,-102" fill="none" stroke="#4f8fe0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g text-anchor="middle" font-size="46" font-weight="900" fill="#2c4a6e">
    <text x="190" y="520">電気が</text>
    <text x="190" y="580">流れる</text>
  </g>

  <!-- 矢印 -->
  <path d="M368,330 h50 M404,312 l20,18 l-20,18" fill="none" stroke="#2c4a6e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ② 物質がくっつくと流れにくくなる -->
  <g transform="translate(610,330) scale(0.82)">
    <use href="#tube"/>
    <use href="#molecule" x="-90" y="-50"/><use href="#molecule" x="-20" y="-54"/>
    <use href="#molecule" x="60" y="-50"/><use href="#molecule" x="-55" y="48"/><use href="#molecule" x="30" y="50"/>
    <use href="#electron" x="-80" y="-120"/>
    <path d="M-50,-120 H10" stroke="#4f8fe0" stroke-width="10" stroke-linecap="round" opacity=".5"/>
    <!-- ブレーキ表示 -->
    <g transform="translate(50,-120)">
      <path d="M-18,-18 L18,18 M18,-18 L-18,18" stroke="#c8393b" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>
  <g text-anchor="middle" font-size="46" font-weight="900">
    <text x="610" y="520" fill="#c8393b">くっつくと</text>
    <text x="610" y="580" fill="#2c4a6e">流れが変わる</text>
  </g>

  <!-- 矢印 -->
  <path d="M790,330 h50 M826,312 l20,18 l-20,18" fill="none" stroke="#2c4a6e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ③ スマホで検出 -->
  <g transform="translate(1070,320)">
    <path d="M-150,-40 q-20,-20 0,-40 M-132,-30 q-34,-30 0,-60" fill="none" stroke="#2c4a6e" stroke-width="6" stroke-linecap="round" transform="translate(40,60)"/>
    <rect x="-80" y="-150" width="160" height="290" rx="22" fill="#2c4a6e" stroke="#22212a" stroke-width="4"/>
    <rect x="-66" y="-128" width="132" height="236" rx="8" fill="#fff"/>
    <!-- メーター -->
    <path d="M-48,-10 A48,48 0 0 1 48,-10" fill="none" stroke="#d5dde7" stroke-width="14"/>
    <path d="M-48,-10 A48,48 0 0 1 34,-44" fill="none" stroke="#e2504f" stroke-width="14"/>
    <line x1="0" y1="-10" x2="32" y2="-48" stroke="#22212a" stroke-width="6" stroke-linecap="round"/>
    <circle cy="-10" r="8" fill="#22212a"/>
    <text y="62" text-anchor="middle" font-size="38" font-weight="900" fill="#c8393b">検出!</text>
  </g>
  <g text-anchor="middle" font-size="46" font-weight="900" fill="#2c4a6e">
    <text x="1070" y="520">スマホで</text>
    <text x="1070" y="580">わかる</text>
  </g>

  <!-- 凡例 -->
  <g font-size="34" font-weight="700" fill="#5d6d7e">
    <use href="#electron" x="360" y="660"/><text x="388" y="672">電気</text>
    <use href="#molecule" x="560" y="660"/><text x="592" y="672">有害な物質</text>
  </g>
</svg>
