<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" font-family="'Noto Sans JP','IPAGothic',sans-serif">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6f7"/>
      <stop offset="1" stop-color="#a9d2ef"/>
    </linearGradient>
    <clipPath id="glassClip">
      <path d="M-110,-150 L110,-150 L88,150 Q86,170 66,170 L-66,170 Q-86,170 -88,150 Z"/>
    </clipPath>
    <clipPath id="lensClip"><circle cx="0" cy="0" r="74"/></clipPath>

    <!-- コップ（中心原点） -->
    <g id="glass">
      <g clip-path="url(#glassClip)">
        <rect x="-120" y="-80" width="240" height="260" fill="url(#water)"/>
        <path d="M-120,-80 Q-60,-92 0,-80 T120,-80" fill="#e3f1fb"/>
      </g>
      <path d="M-110,-150 L110,-150 L88,150 Q86,170 66,170 L-66,170 Q-86,170 -88,150 Z"
            fill="none" stroke="#2c4a6e" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-78,-120 L-64,120" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- 色（目） -->
    <g id="iconEye">
      <path d="M-26,0 Q0,-24 26,0 Q0,24 -26,0 Z" fill="#fff" stroke="#2c4a6e" stroke-width="4" stroke-linejoin="round"/>
      <circle r="8" fill="#2c4a6e"/>
    </g>
    <!-- におい（鼻） -->
    <g id="iconNose">
      <path d="M-2,-24 Q-6,-4 -16,8 Q-20,16 -10,18 Q-4,20 0,14 Q4,20 10,18 Q20,16 16,8"
            fill="none" stroke="#2c4a6e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20,-14 q6,-6 0,-12 M27,-8 q8,-8 0,-16" fill="none" stroke="#2c4a6e" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- 味（舌） -->
    <g id="iconTongue">
      <path d="M-24,-8 Q0,8 24,-8" fill="none" stroke="#2c4a6e" stroke-width="4" stroke-linecap="round"/>
      <path d="M-12,-3 L-12,10 Q-12,24 0,24 Q12,24 12,10 L12,-3" fill="#f2a0a8" stroke="#2c4a6e" stroke-width="4" stroke-linejoin="round"/>
      <path d="M0,2 L0,14" stroke="#2c4a6e" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 判定行 -->
    <g id="rowBase">
      <rect x="-150" y="-26" width="300" height="52" rx="26" fill="#ffffff" stroke="#d5dde7" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1200" height="790" fill="#f7f9fc"/>

  <!-- タイトル -->
  <text x="600" y="74" text-anchor="middle" font-size="44" font-weight="700" fill="#2c4a6e">鉛は水に溶けても<tspan fill="#c8393b">気づけない</tspan></text>
  <line x1="360" y1="98" x2="840" y2="98" stroke="#2c4a6e" stroke-width="3"/>

  <!-- 左：ふつうの水 -->
  <g transform="translate(300,330)">
    <use href="#glass"/>
    <rect x="-120" y="-228" width="240" height="48" rx="24" fill="#2c4a6e"/>
    <text y="-195" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">ふつうの水</text>
  </g>

  <!-- 右：鉛が溶けた水 -->
  <g transform="translate(900,330)">
    <use href="#glass"/>
    <rect x="-120" y="-228" width="240" height="48" rx="24" fill="#c8393b"/>
    <text y="-195" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">鉛が溶けた水</text>

    <!-- 虫めがね：中には鉛イオンが -->
    <g transform="translate(150,40)">
      <line x1="52" y1="52" x2="100" y2="100" stroke="#2c4a6e" stroke-width="16" stroke-linecap="round"/>
      <circle r="74" fill="#cfe6f7"/>
      <g clip-path="url(#lensClip)" font-size="17" font-weight="700" text-anchor="middle">
        <g fill="#7a8796">
          <circle cx="-38" cy="-30" r="20"/><circle cx="26" cy="-42" r="20"/>
          <circle cx="40" cy="14" r="20"/><circle cx="-24" cy="30" r="20"/>
          <circle cx="12" cy="56" r="20"/>
        </g>
        <g fill="#fff">
          <text x="-38" y="-24">Pb</text><text x="26" y="-36">Pb</text>
          <text x="40" y="20">Pb</text><text x="-24" y="36">Pb</text>
          <text x="12" y="62">Pb</text>
        </g>
      </g>
      <circle r="74" fill="none" stroke="#2c4a6e" stroke-width="10"/>
    </g>
    <rect x="104" y="-82" width="172" height="34" rx="17" fill="#fff" stroke="#2c4a6e" stroke-width="2"/>
    <text x="190" y="-58" text-anchor="middle" font-size="18" font-weight="700" fill="#2c4a6e">実は鉛が溶けている</text>
  </g>

  <!-- 中央：見た目は同じ -->
  <g transform="translate(600,330)">
    <circle r="54" fill="#fff" stroke="#2c4a6e" stroke-width="4"/>
    <text y="22" text-anchor="middle" font-size="64" font-weight="700" fill="#2c4a6e">＝</text>
    <text y="92" text-anchor="middle" font-size="22" font-weight="700" fill="#2c4a6e">見分けが</text>
    <text y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#2c4a6e">つかない</text>
  </g>

  <!-- 判定表 -->
  <g font-size="22" font-weight="700">
    <!-- 見出し列（中央） -->
    <g transform="translate(600,580)">
      <use href="#iconEye" transform="translate(-34,0)"/><text x="4" y="8" fill="#2c4a6e">色</text>
    </g>
    <g transform="translate(600,650)">
      <use href="#iconNose" transform="translate(-50,0)"/><text x="-10" y="8" fill="#2c4a6e">におい</text>
    </g>
    <g transform="translate(600,720)">
      <use href="#iconTongue" transform="translate(-34,0)"/><text x="4" y="8" fill="#2c4a6e">味</text>
    </g>

    <!-- 左列 -->
    <g text-anchor="middle" fill="#3d4f63">
      <g transform="translate(300,580)"><use href="#rowBase"/><text y="8">無色・透明</text></g>
      <g transform="translate(300,650)"><use href="#rowBase"/><text y="8">においなし</text></g>
      <g transform="translate(300,720)"><use href="#rowBase"/><text y="8">いつもの味</text></g>
    </g>
    <!-- 右列 -->
    <g text-anchor="middle" fill="#3d4f63">
      <g transform="translate(900,580)"><use href="#rowBase"/><text y="8">無色・透明</text></g>
      <g transform="translate(900,650)"><use href="#rowBase"/><text y="8">においなし</text></g>
      <g transform="translate(900,720)"><use href="#rowBase"/><text y="8">いつもの味</text></g>
    </g>
    <!-- 等号 -->
    <g fill="#9aa9b9" font-size="28" text-anchor="middle">
      <text x="480" y="590">＝</text><text x="720" y="590">＝</text>
      <text x="480" y="660">＝</text><text x="720" y="660">＝</text>
      <text x="480" y="730">＝</text><text x="720" y="730">＝</text>
    </g>
  </g>

</svg>
