<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Noto Sans JP','IPAGothic',sans-serif">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6f7"/>
      <stop offset="1" stop-color="#a9d2ef"/>
    </linearGradient>
    <clipPath id="glassClip">
      <path d="M-110,-150 L110,-150 L88,150 Q86,170 66,170 L-66,170 Q-86,170 -88,150 Z"/>
    </clipPath>
    <clipPath id="lensClip"><circle cx="0" cy="0" r="74"/></clipPath>

    <!-- コップ（中心原点） -->
    <g id="glass">
      <g clip-path="url(#glassClip)">
        <rect x="-120" y="-80" width="240" height="260" fill="url(#water)"/>
        <path d="M-120,-80 Q-60,-92 0,-80 T120,-80" fill="#e3f1fb"/>
      </g>
      <path d="M-110,-150 L110,-150 L88,150 Q86,170 66,170 L-66,170 Q-86,170 -88,150 Z"
            fill="none" stroke="#2c4a6e" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-78,-120 L-64,120" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- 色（目） -->
    <g id="iconEye">
      <path d="M-26,0 Q0,-24 26,0 Q0,24 -26,0 Z" fill="#fff" stroke="#2c4a6e" stroke-width="4" stroke-linejoin="round"/>
      <circle r="8" fill="#2c4a6e"/>
    </g>
    <!-- におい（鼻） -->
    <g id="iconNose">
      <path d="M-2,-24 Q-6,-4 -16,8 Q-20,16 -10,18 Q-4,20 0,14 Q4,20 10,18 Q20,16 16,8"
            fill="none" stroke="#2c4a6e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20,-14 q6,-6 0,-12 M27,-8 q8,-8 0,-16" fill="none" stroke="#2c4a6e" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- 味（舌） -->
    <g id="iconTongue">
      <path d="M-24,-8 Q0,8 24,-8" fill="none" stroke="#2c4a6e" stroke-width="4" stroke-linecap="round"/>
      <path d="M-12,-3 L-12,10 Q-12,24 0,24 Q12,24 12,10 L12,-3" fill="#f2a0a8" stroke="#2c4a6e" stroke-width="4" stroke-linejoin="round"/>
      <path d="M0,2 L0,14" stroke="#2c4a6e" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 判定行 -->
    <g id="rowBase">
      <rect x="-150" y="-26" width="300" height="52" rx="26" fill="#ffffff" stroke="#d5dde7" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1280" height="720" fill="#f7f9fc"/>

  <!-- タイトル -->
  <text x="640" y="92" text-anchor="middle" font-size="68" font-weight="900" fill="#2c4a6e">鉛は水に溶けても<tspan fill="#c8393b">気づけない</tspan></text>

  <!-- 左：ふつうの水 -->
  <g transform="translate(290,340) scale(0.8)"><use href="#glass"/></g>
  <rect x="150" y="128" width="280" height="62" rx="31" fill="#2c4a6e"/>
  <text x="290" y="172" text-anchor="middle" font-size="40" font-weight="900" fill="#fff">ふつうの水</text>

  <!-- 右：鉛が溶けた水 -->
  <g transform="translate(870,340) scale(0.8)"><use href="#glass"/></g>
  <rect x="730" y="128" width="280" height="62" rx="31" fill="#c8393b"/>
  <text x="870" y="172" text-anchor="middle" font-size="40" font-weight="900" fill="#fff">鉛入りの水</text>

  <!-- 虫めがね -->
  <g transform="translate(1080,340)">
    <line x1="64" y1="64" x2="120" y2="120" stroke="#2c4a6e" stroke-width="20" stroke-linecap="round"/>
    <circle r="92" fill="#cfe6f7"/>
    <g font-size="26" font-weight="900" text-anchor="middle">
      <g fill="#6b7888">
        <circle cx="-40" cy="-36" r="30"/><circle cx="34" cy="-44" r="30"/>
        <circle cx="44" cy="28" r="30"/><circle cx="-30" cy="38" r="30"/>
      </g>
      <g fill="#fff">
        <text x="-40" y="-27">Pb</text><text x="34" y="-35">Pb</text>
        <text x="44" y="37">Pb</text><text x="-30" y="47">Pb</text>
      </g>
    </g>
    <circle r="92" fill="none" stroke="#2c4a6e" stroke-width="12"/>
  </g>

  <!-- 中央：＝ -->
  <g transform="translate(580,330)">
    <circle r="62" fill="#fff" stroke="#2c4a6e" stroke-width="5"/>
    <text y="27" text-anchor="middle" font-size="80" font-weight="900" fill="#2c4a6e">＝</text>
  </g>

  <!-- 下段：色・におい・味 -->
  <rect x="0" y="520" width="1280" height="200" fill="#e9eff6"/>
  <g font-size="54" font-weight="900" fill="#2c4a6e">
    <g transform="translate(60,560)">
      <rect width="230" height="120" rx="60" fill="#fff" stroke="#c9d4e1" stroke-width="3"/>
      <use href="#iconEye" transform="translate(68,60) scale(1.7)"/>
      <text x="128" y="80">色</text>
    </g>
    <g transform="translate(310,560)">
      <rect width="300" height="120" rx="60" fill="#fff" stroke="#c9d4e1" stroke-width="3"/>
      <use href="#iconNose" transform="translate(64,62) scale(1.7)"/>
      <text x="120" y="80">におい</text>
    </g>
    <g transform="translate(630,560)">
      <rect width="230" height="120" rx="60" fill="#fff" stroke="#c9d4e1" stroke-width="3"/>
      <use href="#iconTongue" transform="translate(68,56) scale(1.7)"/>
      <text x="128" y="80">味</text>
    </g>
  </g>
  <text x="1065" y="644" text-anchor="middle" font-size="64" font-weight="900" fill="#c8393b">どれも同じ</text>
</svg>
